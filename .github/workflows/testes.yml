name: Testes

# Roda em todo push, não só no cron de scraping (jobradar.yml) — regressão
# na camada de filtro precisa aparecer na hora do commit, não só ser
# descoberta olhando o log de produção 3h depois.
on:
  push:
  workflow_dispatch: {}

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Sem browser/Tesseract de propósito: os testes validam extração,
      # cache, bloqueios e OCR por funções puras/dublês, sem lançar processo
      # externo. Os binários ficam exclusivos do workflow de produção.
      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: pytest tests/ -v
